<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objet partagé</title>
<style>
  :root {
    --fond: #eef2f5;
    --zone: #ffffff;
    --bord: #c9d3db;
    --objet: #2a6f97;
    --texte: #1d2b36;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #121a21;
      --zone: #1a252e;
      --bord: #34454f;
      --objet: #61a5c2;
      --texte: #e4ecf1;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond);
    color: var(--texte);
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  #statut { font-size: 0.85rem; opacity: 0.75; }
  #zone {
    position: relative;
    flex: 1;
    min-height: 240px;
    background: var(--zone);
    border: 1px solid var(--bord);
    border-radius: 10px;
    overflow: hidden;
    touch-action: none; /* indispensable pour le glisser au doigt */
  }
  #objet {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: var(--objet);
    cursor: grab;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
  }
  #objet.saisi { cursor: grabbing; }
  #objet:focus-visible { outline: 3px solid var(--texte); outline-offset: 3px; }
</style>
</head>
<body>
  <header>
    <h1>Déplacez le carré : tous les visiteurs le voient bouger</h1>
    <span id="statut" role="status">Connexion…</span>
  </header>
  <div id="zone">
    <div id="objet" tabindex="0" aria-label="Objet partagé"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ⚠️ Remplacez par la configuration de VOTRE projet Firebase
  // (Paramètres du projet → Vos applications → Configuration du SDK)
  const firebaseConfig = {
    apiKey: "AIzaSyByWXV45AbdIomxdhOheazgeZ1XUVjkCnc",
    authDomain: "online-table-c3a23.firebaseapp.com",
    databaseURL: "https://online-table-c3a23-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "online-table-c3a23",
    storageBucket: "online-table-c3a23.firebasestorage.app",
    messagingSenderId: "982726892863",
    appId: "1:982726892863:web:876125be5abaf9a477478a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const positionRef = ref(db, "objet");

  const zone = document.getElementById("zone");
  const objet = document.getElementById("objet");
  const statut = document.getElementById("statut");

  let enGlissement = false;
  let dernierEnvoi = 0;
  const DELAI_ENVOI_MS = 50; // limite la fréquence d'écriture

  // Les positions sont stockées en proportion (0 à 1) de la zone,
  // pour que l'objet soit au même endroit quelle que soit la taille de la fenêtre.
  function afficher(x, y) {
    objet.style.left = (x * zone.clientWidth) + "px";
    objet.style.top = (y * zone.clientHeight) + "px";
  }

  let derniere = { x: 0.5, y: 0.5 };
  afficher(derniere.x, derniere.y);
  window.addEventListener("resize", () => afficher(derniere.x, derniere.y));

  // Réception des positions envoyées par les autres visiteurs
  onValue(positionRef, (snapshot) => {
    statut.textContent = "Connecté";
    const v = snapshot.val();
    if (!v || enGlissement) return; // on ignore pendant qu'on déplace soi-même
    derniere = { x: v.x, y: v.y };
    afficher(v.x, v.y);
  }, () => {
    statut.textContent = "Erreur de connexion (vérifiez la config et les règles)";
  });

  function envoyer(x, y, force = false) {
    const maintenant = Date.now();
    if (!force && maintenant - dernierEnvoi < DELAI_ENVOI_MS) return;
    dernierEnvoi = maintenant;
    set(positionRef, { x, y });
  }

  function positionDepuisEvenement(e) {
    const r = zone.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    return { x, y };
  }

  objet.addEventListener("pointerdown", (e) => {
    enGlissement = true;
    objet.classList.add("saisi");
    objet.setPointerCapture(e.pointerId);
  });

  objet.addEventListener("pointermove", (e) => {
    if (!enGlissement) return;
    derniere = positionDepuisEvenement(e);
    afficher(derniere.x, derniere.y); // affichage local immédiat
    envoyer(derniere.x, derniere.y);
  });

  function relacher() {
    if (!enGlissement) return;
    enGlissement = false;
    objet.classList.remove("saisi");
    envoyer(derniere.x, derniere.y, true); // dernière position exacte
  }
  objet.addEventListener("pointerup", relacher);
  objet.addEventListener("pointercancel", relacher);

  // Accessibilité : déplacement aux flèches du clavier
  objet.addEventListener("keydown", (e) => {
    const pas = 0.02;
    const d = { ArrowLeft: [-pas, 0], ArrowRight: [pas, 0], ArrowUp: [0, -pas], ArrowDown: [0, pas] }[e.key];
    if (!d) return;
    e.preventDefault();
    derniere = {
      x: Math.min(1, Math.max(0, derniere.x + d[0])),
      y: Math.min(1, Math.max(0, derniere.y + d[1]))
    };
    afficher(derniere.x, derniere.y);
    envoyer(derniere.x, derniere.y, true);
  });
</script>
</body>
</html>
